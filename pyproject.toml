[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "buscador-milhas"
version = "0.1.0"
description = "Buscador pessoal de passagens com milhas saindo de Fortaleza (FOR)"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.27,<1",
  "Jinja2>=3.1,<4",
  "PyYAML>=6.0,<7",
  "tzdata>=2024.1",
]

[project.optional-dependencies]
browser = ["playwright>=1.45"]
dev = ["pytest>=8.0", "ruff>=0.6", "playwright>=1.45"]

[project.scripts]
buscador = "buscador.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
