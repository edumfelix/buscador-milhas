name: discovery

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Instalar dependências
        run: |
          pip install -e ".[browser]"
          python -m playwright install --with-deps chromium

      - name: Probe de conectividade e API (G0)
        run: |
          python -m buscador discover \
            --providers all \
            --out artifacts/discovery.json \
            --api

      - uses: actions/upload-artifact@v4
        with:
          name: discovery-${{ github.run_id }}
          path: artifacts/discovery.json
          retention-days: 30
